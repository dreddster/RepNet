name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - buba/**

permissions:
  contents: read

jobs:
  public-protocol-and-adapters:
    name: Public protocol and adapter guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test contracts
        run: npm run test:contracts

      - name: Test SDK
        run: npm run test:sdk

      - name: Test Eliza adapter
        run: npm run test:eliza

      - name: Build Eliza adapter
        run: npm run build:eliza

      - name: Test AgentKit adapter
        run: npm run test:agentkit

      - name: Build AgentKit adapter
        run: npm run build:agentkit

      - name: Build public core packages
        run: npm run build:core

      - name: Check package surfaces
        run: npm run pack:check

      - name: Check release readiness
        run: npm run release:check

      - name: Audit production dependency graph
        run: npm run audit:prod
